[project]
name = "ymir-dev"
version = "0.1.0"
description = "Builds a preview gyc from the dev gymir, bootstrap and midgard trees"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
start = "ymir_dev.start:main"
preview = "ymir_dev.preview:main"
tests = "ymir_dev.tests:main"
exec = "ymir_dev.exec_:main"
ymirc = "ymir_dev.exec_:main"
prepare-release = "ymir_dev.release:main"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
